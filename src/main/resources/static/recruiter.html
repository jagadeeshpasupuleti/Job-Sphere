<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background-color: #0F1117;
  font-family: 'DM Sans', sans-serif;
  color: #F0F2F5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── NAV ── */
nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 32px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  background: rgba(15,17,23,0.9);
  backdrop-filter: blur(16px);
  position: sticky;
  top: 0;
  z-index: 200;
  flex-shrink: 0;
}
.brand { display: flex; align-items: center; gap: 9px; }
.brand-logo {
  width: 30px; height: 30px;
  background: linear-gradient(135deg, #FF6B6B, #00D4AA);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
}
.brand-name {
  font-family: 'Syne', sans-serif; font-weight: 800;
  font-size: 15px; letter-spacing: -0.3px;
}
.nav-right { display: flex; align-items: center; gap: 10px; }
#userInfo {
  font-size: 12px; color: rgba(240,242,245,0.35);
  padding: 5px 12px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 20px;
}
.nbtn {
  padding: 7px 14px; border-radius: 8px;
  font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600;
  cursor: pointer; text-decoration: none; border: none;
  transition: background 0.18s, color 0.18s;
}
.nbtn-ghost {
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
  color: rgba(240,242,245,0.65);
}
.nbtn-ghost:hover { background: rgba(255,255,255,0.1); color: #F0F2F5; }
.nbtn-danger {
  background: rgba(255,107,107,0.09); border: 1px solid rgba(255,107,107,0.22);
  color: #FF6B6B;
}
.nbtn-danger:hover { background: rgba(255,107,107,0.18); }

/* ── MAIN SPLIT ── */
.workspace {
  flex: 1;
  display: grid;
  grid-template-columns: 380px 1fr;
  min-height: 0;
}

/* ── LEFT PANEL: POST JOB ── */
.left-panel {
  border-right: 1px solid rgba(255,255,255,0.07);
  background: rgba(255,255,255,0.015);
  display: flex;
  flex-direction: column;
  padding: 32px 28px;
  gap: 0;
  overflow-y: auto;
}
.panel-eyebrow {
  font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
  text-transform: uppercase; color: rgba(240,242,245,0.25);
  margin-bottom: 6px;
}
.panel-heading {
  font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800;
  letter-spacing: -0.5px; margin-bottom: 28px; color: #F0F2F5;
}

.field { margin-bottom: 16px; }
.field label {
  display: block; font-size: 11px; font-weight: 600;
  letter-spacing: 1px; text-transform: uppercase;
  color: rgba(240,242,245,0.35); margin-bottom: 7px;
}
.field input {
  width: 100%; background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: 11px; padding: 12px 14px;
  color: #F0F2F5; font-family: 'DM Sans', sans-serif; font-size: 14px;
  outline: none; transition: border-color 0.2s, box-shadow 0.2s;
}
.field input:focus {
  border-color: #00D4AA;
  box-shadow: 0 0 0 3px rgba(0,212,170,0.11);
}
.field input::placeholder { color: rgba(240,242,245,0.2); }

/* skills tag preview */
.skill-preview {
  display: flex; flex-wrap: wrap; gap: 6px;
  min-height: 0; margin-top: 8px;
}
.skill-tag-preview {
  padding: 3px 10px; border-radius: 6px;
  background: rgba(0,212,170,0.1); border: 1px solid rgba(0,212,170,0.2);
  color: #00D4AA; font-size: 12px; font-weight: 600;
}

.btn-post {
  width: 100%; padding: 14px; margin-top: 8px;
  background: linear-gradient(135deg, #FF6B6B, #e05555);
  border: none; border-radius: 12px; color: #fff;
  font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 700;
  cursor: pointer; box-shadow: 0 6px 22px rgba(255,107,107,0.28);
  transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
  letter-spacing: 0.2px;
}
.btn-post:hover {
  opacity: 0.9; transform: translateY(-1px);
  box-shadow: 0 10px 28px rgba(255,107,107,0.4);
}
.btn-post:active { transform: translateY(0); }

/* divider in left panel */
.left-divider {
  border: none; border-top: 1px solid rgba(255,255,255,0.06);
  margin: 28px 0;
}

/* stat strip */
.stat-strip { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat-mini {
  padding: 14px 16px; border-radius: 14px; text-align: center;
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07);
}
.stat-mini-n {
  font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 800;
  line-height: 1; margin-bottom: 3px; color: #FF6B6B;
}
.stat-mini-l {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px;
  color: rgba(240,242,245,0.25);
}

/* ── RIGHT PANEL: JOBS LIST ── */
.right-panel {
  display: flex; flex-direction: column;
  background: #0F1117;
  background-image:
    radial-gradient(ellipse 70% 40% at 80% 0%, rgba(0,212,170,0.07) 0%, transparent 55%),
    radial-gradient(ellipse 40% 50% at 10% 100%, rgba(255,107,107,0.05) 0%, transparent 55%);
  overflow-y: auto;
}

.right-header {
  padding: 28px 32px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  display: flex; align-items: flex-end; justify-content: space-between;
  flex-shrink: 0;
}
.right-title {
  font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800;
  letter-spacing: -0.4px;
}
.right-subtitle { font-size: 12px; color: rgba(240,242,245,0.3); margin-top: 3px; }
.jobs-count {
  padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700;
  background: rgba(255,107,107,0.1); border: 1px solid rgba(255,107,107,0.22);
  color: #FF6B6B;
}

/* Jobs scroll area */
.jobs-scroll { flex: 1; padding: 20px 32px 40px; overflow-y: auto; }
#jobs { display: flex; flex-direction: column; gap: 12px; }

.job-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 18px; padding: 20px 22px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  transition: border-color 0.2s, background 0.2s, transform 0.15s;
}
.job-card:hover {
  border-color: rgba(255,255,255,0.14);
  background: rgba(255,255,255,0.05);
  transform: translateY(-1px);
}
.job-info { flex: 1; min-width: 0; }
.job-title {
  font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700;
  margin-bottom: 6px; color: #F0F2F5; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.job-meta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.job-loc {
  display: flex; align-items: center; gap: 4px;
  font-size: 12px; color: rgba(240,242,245,0.4);
}
.job-salary {
  display: flex; align-items: center; gap: 4px;
  font-size: 12px; font-weight: 600; color: #00D4AA;
}
.job-skills { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.skill-chip {
  padding: 3px 9px; border-radius: 6px; font-size: 11px; font-weight: 600;
  background: rgba(0,212,170,0.09); border: 1px solid rgba(0,212,170,0.18);
  color: rgba(0,212,170,0.8);
}
.btn-view {
  padding: 9px 18px; border-radius: 10px; cursor: pointer; white-space: nowrap;
  background: rgba(255,107,107,0.1); border: 1px solid rgba(255,107,107,0.25);
  color: #FF6B6B; font-family: 'DM Sans', sans-serif;
  font-size: 12px; font-weight: 600; flex-shrink: 0;
  transition: background 0.18s, transform 0.15s;
}
.btn-view:hover { background: rgba(255,107,107,0.2); transform: translateY(-1px); }
.btn-view:active { transform: translateY(0); }

.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 60px 20px; text-align: center;
}
.empty-icon {
  width: 56px; height: 56px; border-radius: 16px; margin-bottom: 14px;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center;
}
.empty-text { font-size: 15px; color: rgba(240,242,245,0.22); }
.empty-sub { font-size: 12px; color: rgba(240,242,245,0.14); margin-top: 4px; }

/* ── APPLICANTS OVERLAY ── */
.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(10,11,16,0.85); backdrop-filter: blur(10px);
  z-index: 300; align-items: center; justify-content: center; padding: 24px;
}
.overlay.open { display: flex; }
.overlay-card {
  background: #14161f; border: 1px solid rgba(255,255,255,0.1);
  border-radius: 22px; width: 100%; max-width: 480px;
  max-height: 80vh; display: flex; flex-direction: column;
  box-shadow: 0 40px 80px rgba(0,0,0,0.6);
  animation: slideUp 0.25s ease;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
.overlay-head {
  padding: 22px 24px 18px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.overlay-title {
  font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 800;
}
.overlay-close {
  width: 32px; height: 32px; border-radius: 8px; cursor: pointer;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.09);
  color: rgba(240,242,245,0.5); font-size: 18px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, color 0.15s;
}
.overlay-close:hover { background: rgba(255,107,107,0.12); color: #FF6B6B; }
.overlay-body { overflow-y: auto; flex: 1; padding: 16px 24px 24px; }
.applicant-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: 12px; margin-bottom: 8px;
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07);
}
.app-avatar {
  width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
  background: linear-gradient(135deg, rgba(255,107,107,0.25), rgba(0,212,170,0.15));
  display: flex; align-items: center; justify-content: center;
  font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700;
  color: #F0F2F5;
}
.app-info { flex: 1; }
.app-id { font-size: 13px; font-weight: 600; color: #F0F2F5; }
.app-label { font-size: 11px; color: rgba(240,242,245,0.3); margin-top: 1px; }

/* ── ANIMATIONS ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.workspace { animation: fadeUp 0.35s ease both; }

@media (max-width: 720px) {
  .workspace { grid-template-columns: 1fr; }
  .left-panel { border-right: none; border-bottom: 1px solid rgba(255,255,255,0.07); }
}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="brand">
    <div class="brand-logo">
      <svg width="13" height="13" viewBox="0 0 22 22" fill="none">
        <path d="M11 2L19.5 7V15L11 20L2.5 15V7L11 2Z" fill="rgba(15,17,23,0.9)"/>
      </svg>
    </div>
    <span class="brand-name">JobBoard</span>
  </div>
  <div class="nav-right">
    <div id="userInfo"></div>
    <a href="recruiter-profile.html" class="nbtn nbtn-ghost">My Profile</a>
    <a href="#" onclick="logout(); return false;" class="nbtn nbtn-danger">Logout</a>
  </div>
</nav>

<!-- SPLIT WORKSPACE -->
<div class="workspace">

  <!-- LEFT: POST JOB -->
  <div class="left-panel">
    <div class="panel-eyebrow">Recruiter Dashboard</div>
    <div class="panel-heading">Post a Job</div>

    <div class="field">
      <label>Job Title</label>
      <input id="title" placeholder="e.g. Senior Java Developer">
    </div>
    <div class="field">
      <label>Location</label>
      <input id="location" placeholder="e.g. Hyderabad, Remote">
    </div>
    <div class="field">
      <label>Salary</label>
      <input id="salary" placeholder="e.g. ₹12 LPA, $90k">
    </div>
    <div class="field">
      <label>Required Skills</label>
      <input id="skills" placeholder="java, spring, mongodb…" oninput="previewSkills(this.value)">
      <div class="skill-preview" id="skillPreview"></div>
    </div>

    <button class="btn-post" onclick="addJob()">Post Job →</button>

    <hr class="left-divider">

    <div class="panel-eyebrow" style="margin-bottom:12px;">Overview</div>
    <div class="stat-strip">
      <div class="stat-mini">
        <div class="stat-mini-n" id="statTotal">0</div>
        <div class="stat-mini-l">Jobs Posted</div>
      </div>
      <div class="stat-mini">
        <div class="stat-mini-n" style="color:#00D4AA;" id="statApps">—</div>
        <div class="stat-mini-l">Listings Live</div>
      </div>
    </div>
  </div>

  <!-- RIGHT: JOBS LIST -->
  <div class="right-panel">
    <div class="right-header">
      <div>
        <div class="right-title">Your Listings</div>
        <div class="right-subtitle">Jobs you've posted on the platform</div>
      </div>
      <div class="jobs-count" id="jobsCount">0 jobs</div>
    </div>
    <div class="jobs-scroll">
      <div id="jobs"></div>
    </div>
  </div>

</div>

<!-- APPLICANTS OVERLAY -->
<div class="overlay" id="overlay" onclick="closeOverlay(event)">
  <div class="overlay-card">
    <div class="overlay-head">
      <div class="overlay-title">Applicants</div>
      <button class="overlay-close" onclick="document.getElementById('overlay').classList.remove('open')">×</button>
    </div>
    <div class="overlay-body" id="overlayBody"></div>
  </div>
</div>

<script>
const user = JSON.parse(localStorage.getItem("user"));
const token = localStorage.getItem("token");

if (!user || !user.id) {
    alert("Please login as recruiter first.");
    window.location.href = "login.html";
}

document.getElementById("userInfo").textContent = `${user.name || "User"} (${user.email || "no-email"}) • ${user.role || "UNKNOWN"}`;

// Skill tag preview while typing
function previewSkills(val) {
    const tags = val.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
    document.getElementById('skillPreview').innerHTML = tags
        .map(t => `<span class="skill-tag-preview">${t}</span>`).join('');
}

function addJob() {
    const titleInput = document.getElementById('title');
    const locationInput = document.getElementById('location');
    const salaryInput = document.getElementById('salary');
    const skillsInput = document.getElementById('skills');

    const title = titleInput.value.trim();
    const location = locationInput.value.trim();
    const salary = salaryInput.value.trim();
    const skills = skillsInput.value
        .split(",")
        .map(s => s.trim().toLowerCase())
        .filter(Boolean);

    if (!title || !location || !salary) {
        alert("Please fill title, location, and salary.");
        return;
    }

    const headers = {"Content-Type":"application/json"};
    if (token) headers["Authorization"] = "Bearer " + token;

    fetch("http://localhost:8080/api/jobs", {
        method: "POST",
        headers,
        body: JSON.stringify({
            title, location, salary,
            description: "test",
            lat: 0, lng: 0,
            recruiterId: user.id,
            skills: skills
        })
    })
    .then(async (res) => {
        if (!res.ok) {
            const errorText = await res.text();
            throw new Error(errorText || "Failed to create job");
        }
        return res.json();
    })
    .then(() => {
        titleInput.value = '';
        locationInput.value = '';
        salaryInput.value = '';
        skillsInput.value = '';
        document.getElementById('skillPreview').innerHTML = '';
        loadJobs();
        alert("Job posted successfully.");
    })
    .catch(err => { alert("Job post failed: " + err.message); });
}

function loadJobs() {
    const headers = {};
    if (token) headers["Authorization"] = "Bearer " + token;

    fetch("http://localhost:8080/api/jobs", { headers })
    .then(async (res) => {
        if (!res.ok) {
            const errorText = await res.text();
            throw new Error(errorText || "Failed to load jobs");
        }
        return res.json();
    })
    .then(data => {
        const mine = data.filter(j => j.recruiterId == user.id);
        document.getElementById('statTotal').textContent = mine.length;
        document.getElementById('statApps').textContent = mine.length;
        document.getElementById('jobsCount').textContent = mine.length + ' job' + (mine.length !== 1 ? 's' : '');

        if (!mine.length) {
            document.getElementById("jobs").innerHTML = `
              <div class="empty-state">
                <div class="empty-icon">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <rect x="3" y="7" width="18" height="14" rx="3" stroke="rgba(240,242,245,0.25)" stroke-width="1.5"/>
                    <path d="M8 7V5a4 4 0 018 0v2" stroke="rgba(240,242,245,0.25)" stroke-width="1.5" stroke-linecap="round"/>
                  </svg>
                </div>
                <div class="empty-text">No jobs posted yet</div>
                <div class="empty-sub">Use the form on the left to post your first listing</div>
              </div>`;
            return;
        }

        let html = '';
        mine.forEach(j => {
            const skillsHTML = Array.isArray(j.skills) && j.skills.length
                ? j.skills.map(s => `<span class="skill-chip">${s}</span>`).join('')
                : '';

            html += `
            <div class="job-card">
              <div class="job-info">
                <div class="job-title">${j.title}</div>
                <div class="job-meta">
                  <span class="job-loc">
                    <svg width="11" height="11" viewBox="0 0 14 14" fill="none"><path d="M7 1.5C5.07 1.5 3.5 3.07 3.5 5c0 2.625 3.5 7 3.5 7s3.5-4.375 3.5-7c0-1.93-1.57-3.5-3.5-3.5zm0 4.75a1.25 1.25 0 110-2.5 1.25 1.25 0 010 2.5z" fill="rgba(240,242,245,0.35)"/></svg>
                    ${j.location}
                  </span>
                  <span class="job-salary">
                    <svg width="11" height="11" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.5" stroke="#00D4AA" stroke-width="1.3"/><path d="M7 4.5v5M5 6.5h3a.5.5 0 010 1H6a.5.5 0 000 1h3" stroke="#00D4AA" stroke-width="1.1" stroke-linecap="round"/></svg>
                    ${j.salary}
                  </span>
                </div>
                ${skillsHTML ? `<div class="job-skills">${skillsHTML}</div>` : ''}
              </div>
              <button class="btn-view" onclick="viewApps('${j.id}')">View Applicants</button>
            </div>`;
        });
        document.getElementById("jobs").innerHTML = html;
    })
    .catch(err => {
        document.getElementById("jobs").innerHTML = "<p style='color:rgba(240,242,245,0.3);padding:20px;'>Failed to load jobs.</p>";
        alert("Error loading jobs: " + err.message);
    });
}

function viewApps(jobId) {
    fetch("http://localhost:8080/api/applications/job/" + jobId + "/details")
    .then(res => res.json())
    .then(data => {
        const overlay = document.getElementById('overlay');
        const body = document.getElementById('overlayBody');

        if (!data.length) {
            body.innerHTML = `<div style="text-align:center;padding:32px 0;color:rgba(240,242,245,0.25);font-size:14px;">No applicants yet</div>`;
        } else {
            body.innerHTML = data.map(a => {
                const letter = (a.name || a.email || 'U').toString().slice(0,1).toUpperCase();
                const skills = Array.isArray(a.candidateSkills) ? a.candidateSkills : [];
                const skillsHtml = skills.length
                    ? skills.map(s => `<span class="skill-chip">${s}</span>`).join('')
                    : `<span style="font-size:11px;color:rgba(240,242,245,0.3);">No skills available</span>`;

                const score = typeof a.matchScore === 'number' ? a.matchScore : 0;
                const scoreColor = score >= 70 ? '#00D4AA' : (score >= 40 ? '#f5c542' : '#FF6B6B');

                return `
                <div class="applicant-row" style="align-items:flex-start;">
                  <div class="app-avatar">${letter}</div>
                  <div class="app-info">
                    <div class="app-id">${a.name || 'Unknown Applicant'}</div>
                    <div class="app-label">${a.email || 'No email'} • ${a.role || 'SEEKER'}</div>
                    <div style="margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                      <span style="font-size:11px;color:rgba(240,242,245,0.35);">Skills:</span>
                      ${skillsHtml}
                    </div>
                  </div>
                  <div style="margin-left:auto;padding:5px 10px;border-radius:999px;border:1px solid ${scoreColor};color:${scoreColor};font-size:11px;font-weight:700;white-space:nowrap;">
                    Match ${score}%
                  </div>
                </div>`;
            }).join('');
        }

        overlay.classList.add('open');
    })
    .catch(() => {
        const overlay = document.getElementById('overlay');
        const body = document.getElementById('overlayBody');
        body.innerHTML = `<div style="text-align:center;padding:32px 0;color:#FF6B6B;font-size:14px;">Failed to load applicant details</div>`;
        overlay.classList.add('open');
    });
}

function closeOverlay(e) {
    if (e.target === document.getElementById('overlay')) {
        document.getElementById('overlay').classList.remove('open');
    }
}

if (user) loadJobs();

function logout() {
    localStorage.removeItem("user");
    localStorage.removeItem("token");
    window.location.href = "index.html";
}
